<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Tax Receipt</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .card {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1a1a1a;
        }

        .info {
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            margin-top: 5px;
            font-size: 18px;
        }

        .amount {
            color: #008000;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Registration Tax Receipt</h1>

    <div class="info">
        <div class="label">Receipt Number</div>
        <div class="value">REC543267893</div>
    </div>

    <div class="info">
        <div class="label">Name</div>
        <div class="value">Sanchayata Paul</div>
    </div>

    <div class="info">
        <div class="label">Registration Number</div>
        <div class="value">AS06AK4335</div>
    </div>

    <div class="info">
        <div class="label">Date</div>
        <div class="value">11-SEPT-2026</div>
    </div>

    <div class="info">
        <div class="label">Amount</div>
        <div class="value amount">₹37,898</div>
    </div>

    <div class="info">
        <div class="label">Status</div>
        <div class="value">PAID</div>
    </div>

</div>

</body>
</html>
